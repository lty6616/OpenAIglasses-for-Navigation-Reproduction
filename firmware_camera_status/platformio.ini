[platformio]
default_envs = xiao_esp32s3_camera

[env:xiao_esp32s3_camera]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
lib_deps =
    gilmaimon/ArduinoWebsockets@^0.5.4
